name: Import Static Website Mine Details to Cloudflare D1

on:
  push:
    branches:
      - main
      - develop
      - dev
    paths:
      - "website-mine-details.json"
      - "d1_website_mine_details.sql"
      - "scripts/import_website_mine_details_static.py"
      - ".github/workflows/import-website-mine-details-static.yml"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional comma-separated tickers, e.g. AEM,NEM"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  import-static-mine-details:
    runs-on: ubuntu-latest
    env:
      CF_D1_DATABASE: minerlytics-dev
      INPUT_SYMBOLS: ${{ inputs.symbols }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Generate Website_mine_details import SQL
        run: |
          set -euo pipefail
          mkdir -p .tmp
          python scripts/import_website_mine_details_static.py \
            --input-json website-mine-details.json \
            --schema-sql d1_website_mine_details.sql \
            --output-sql .tmp/website-mine-details-static.sql \
            --symbols "${INPUT_SYMBOLS:-}"

      - name: Write Website_mine_details rows to Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute "$CF_D1_DATABASE" --remote --file .tmp/website-mine-details-static.sql --yes
