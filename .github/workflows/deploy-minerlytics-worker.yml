name: Deploy Minerlytics Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler deploy --minify > wrangler-deploy.log 2>&1
          status=$?
          cat wrangler-deploy.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 40 wrangler-deploy.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error file=wrangler.toml,title=Wrangler deploy failed::${message}"
            exit "$status"
          fi

      - name: Verify AEM mine details endpoint
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = "https://minerlytics-dev.lincbennette87.workers.dev/api/company-projects?ticker=AEM&limit=50";
          const expectedMinimumRows = 19;
          const maxAttempts = 10;
          const waitMs = 6000;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          let lastPayload = null;
          for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
            const response = await fetch(endpoint, {
              headers: { accept: "application/json" },
              cache: "no-store"
            });
            const payload = await response.json().catch(() => ({}));
            lastPayload = payload;

            const projects = Array.isArray(payload.projects) ? payload.projects : [];
            if (payload.ok && payload.source === "Website_mine_details" && projects.length >= expectedMinimumRows) {
              console.log(`Verified AEM endpoint: ${projects.length} rows from ${payload.source}.`);
              console.log(projects.map((project) => project.projectName).join(" | "));
              process.exit(0);
            }

            console.log(
              `Attempt ${attempt}/${maxAttempts}: source=${payload.source || "n/a"}, rows=${projects.length}.`
            );
            if (attempt < maxAttempts) await sleep(waitMs);
          }

          console.error("AEM mine details verification failed.");
          console.error(JSON.stringify({
            ok: lastPayload?.ok,
            source: lastPayload?.source,
            rows: Array.isArray(lastPayload?.projects) ? lastPayload.projects.length : 0
          }, null, 2));
          process.exit(1);
          NODE
